<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>银发回忆录 · 双端协同一屏演示</title>
<style>
:root{
  --paper:#fbf8f3;--white:#fffdf9;--ink:#3e3128;--muted:#63574a;--line:#e9dfd0;
  --red:#9a4b2b;--red-d:#7d3b22;--green:#5a7050;--tan:#a87e54;
  --serif:'Noto Serif SC','Songti SC',serif;--sans:-apple-system,'PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:#ece4d4;color:var(--ink);position:relative}
/* 设计台固定 1560×1040，窗口不足时整体等比缩放居中（手机本身始终 1.5× 不变形） */
#zoom{position:absolute;left:50%;top:0;transform-origin:top center;width:1560px;height:1040px;display:flex;flex-direction:column}
/* ===== 顶栏 ===== */
.topbar{flex:none;display:flex;align-items:center;gap:9px;padding:8px 20px;background:linear-gradient(160deg,#fbf8f3,#f1e5d3);border-bottom:1px solid var(--line)}
.topbar h1{font-family:var(--serif);font-size:15px;letter-spacing:1px;white-space:nowrap}
.topbar h1 i{font-style:normal;background:var(--red);color:#fffdf9;border-radius:6px;padding:1px 7px;margin-right:6px;font-size:12px}
.nodes{display:flex;gap:6px;flex-wrap:wrap}
.nodebtn{border:1px solid var(--line);background:var(--white);border-radius:16px;padding:6px 11px;font-size:11.5px;cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--ink);transition:all .2s;white-space:nowrap}
.nodebtn b{width:16px;height:16px;border-radius:50%;background:#d8c9b4;color:#fff;display:grid;place-items:center;font-size:9.5px}
.nodebtn.on{background:var(--red);border-color:var(--red);color:#fffdf9;box-shadow:0 4px 12px #9a4b2b44}
.nodebtn.on b{background:#fffdf9;color:var(--red)}
.nodebtn.free.on{background:var(--green);border-color:var(--green)}
.nodebtn.free.on b{color:var(--green)}
#autoplay{margin-left:auto;border:0;background:var(--ink);color:#fffdf9;border-radius:16px;padding:7px 15px;font-size:11.5px;cursor:pointer;white-space:nowrap}
#autoplay.playing{background:var(--red)}
/* 步骤条 */
.stepbar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 22px;background:#f6efe2;border-bottom:1px solid var(--line);font-size:11px}
.stepbar .st-name{font-weight:700;color:var(--red);white-space:nowrap}
.stepbar .st-side{flex:none;font-size:9.5px;border-radius:9px;padding:2px 8px;background:#e8dcc4;color:#6b5426}
.stepbar .dots{display:flex;gap:5px}
.stepbar .dots i{width:7px;height:7px;border-radius:50%;background:#d8c9b4}
.stepbar .dots i.on{background:var(--red)}
.stepbar .agent{margin-left:auto;color:var(--tan);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44%}
.stepbar .agent b{color:var(--red)}
.stepbar .nav{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:3px 10px;font-size:11px;cursor:pointer}
/* ===== 主区三栏 ===== */
.stage3{flex:1;min-height:0;display:grid;grid-template-columns:414px minmax(380px,1fr) 414px;gap:20px;padding:8px 22px 10px;justify-content:center}
.sidecol{position:relative;display:flex;flex-direction:column;min-height:0;gap:6px;align-items:center}
.who{flex:none;width:100%;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.who img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.who small{color:var(--muted);font-weight:400;margin-left:auto;font-size:9.5px}
/* iPhone 高保真壳 —— 固定尺寸 1.5×（414×840），不随窗口缩放 */
.iphone{flex:none;width:414px;height:840px;position:relative;border-radius:64px;background:linear-gradient(135deg,#0d0e10,#3a3b3e 45%,#141516 65%,#55555a);padding:10px;box-shadow:0 26px 60px #2a201866,0 0 0 1px #5c5c60;transition:opacity .35s,filter .35s;overflow:visible}
.iphone.dim{opacity:.45;filter:saturate(.6)}
.iphone:before,.iphone:after{content:"";position:absolute;background:#343438;width:4px;border-radius:3px;left:-3px}
.iphone:before{top:150px;height:62px}.iphone:after{top:228px;height:98px}
.iphone .scr{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:var(--paper)}
.iphone .island{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:15px;background:#0d0e10;z-index:40;pointer-events:none}
.iphone iframe{position:absolute;left:50%;top:50%;width:410px;height:866px;border:0;transform:translate(-50%,-50%) scale(0.947);transform-origin:center}
/* JTBD · storyboard 一段话 */
.jtbd{flex:none;width:100%;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11.5px;line-height:1.75;color:var(--muted)}
.jtbd b{color:var(--red)}
/* 悬浮标注：挂在手机靠中间栏一侧（不遮挡 App 界面），白底无边框；连线末端动效圆点精确指向屏幕上的功能 */
.anno{position:absolute;z-index:30;background:#fff;border:0;border-radius:10px;padding:7px 10px;font-size:11px;line-height:1.55;color:#5c4a2a;box-shadow:0 10px 26px #6b4f3440;width:150px;animation:annoIn .4s ease both}
.anno b{color:var(--red);display:block;font-size:11.5px;margin-bottom:1px}
@keyframes annoIn{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.anno.out-r{left:calc(100% + 12px)}
.anno.out-l{right:calc(100% + 12px)}
.hitdot{position:absolute;z-index:29;width:13px;height:13px;border-radius:50%;background:var(--red);border:2.5px solid #fff;transform:translate(-50%,-50%);animation:dotPulse 1.6s ease-out infinite;pointer-events:none}
@keyframes dotPulse{0%{box-shadow:0 0 0 0 #9a4b2b77}70%{box-shadow:0 0 0 13px #9a4b2b00}100%{box-shadow:0 0 0 0 #9a4b2b00}}
.conn{position:absolute;inset:0;z-index:28;pointer-events:none;overflow:visible}
.conn line{stroke:#c8a35e;stroke-width:2}
/* ===== 中间栏 ===== */
.centercol{display:flex;flex-direction:column;min-height:0;gap:5px}
.chead{flex:none;text-align:center}
.chead h2{font-family:var(--serif);font-size:13.5px}
.chead small{font-size:9px;color:var(--muted)}
.io-row{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.io{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:9.5px;line-height:1.5;box-shadow:0 3px 9px #6b4f340d}
.io h4{font-size:9.5px;margin-bottom:2px;display:flex;align-items:center;gap:5px}
.io h4 img{width:14px;height:14px;border-radius:50%;object-fit:cover}
.io .quote{border-left:3px solid var(--red);padding-left:6px;font-family:var(--serif);font-size:9.5px}
.io .note{margin-top:3px;background:#f7f0e2;border-radius:6px;padding:2px 6px;font-size:8.5px;color:#6b5426}
.io .ag{margin-top:3px;font-size:8px;color:var(--tan);border-top:1px dashed var(--line);padding-top:2px}
.io .ag b{color:var(--red)}
/* 小忆指令层：左卡箭头朝左指向讲述端，右卡箭头朝右指向协助端 */
.xyrow{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.xy{position:relative;background:#f4eedd;border:1px dashed #d5c29a;border-radius:10px;padding:5px 9px;font-size:9px;line-height:1.5;color:#5c4a2a}
.xy h5{font-size:9px;color:var(--red);display:flex;align-items:center;gap:5px;margin-bottom:1px}
.xy h5 i{font-style:normal;width:13px;height:13px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:8px}
.xy b{color:var(--red-d)}
.xy .ag{margin-top:2px;font-size:8px;color:var(--tan);border-top:1px dashed #d5c29a;padding-top:2px}
.xy.l:before{content:"←";position:absolute;left:-22px;top:50%;transform:translateY(-50%);color:var(--red);font-size:15px;font-weight:700}
.xy.r:after{content:"→";position:absolute;right:-22px;top:50%;transform:translateY(-50%);color:var(--red);font-size:15px;font-weight:700}
.merge{flex:none;display:flex;align-items:center;gap:8px;color:var(--tan);font-size:9px;letter-spacing:.14em;min-height:14px;transition:opacity .5s}
.merge:before,.merge:after{content:"";flex:1;height:1.5px;background:repeating-linear-gradient(90deg,#c8a35e 0 6px,transparent 6px 12px)}
.merge span{display:inline-block}
.merge.dissolve:before,.merge.dissolve:after{display:none}
.merge.dissolve span{animation:fly .9s ease-in forwards;animation-delay:var(--dl)}
.merge.gone{display:none}
@keyframes fly{to{transform:translate(var(--tx),var(--ty)) rotate(var(--rt));opacity:0}}
/* 纸张文稿 */
.paper{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;background:linear-gradient(175deg,#fffdf6,#faf3e6);border:1px solid #e2d4ba;border-radius:12px;padding:10px 14px 9px;box-shadow:0 8px 22px #6b4f3414;position:relative}
.paper:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:3px;background:var(--red)}
.paper .phead{position:sticky;top:-10px;background:linear-gradient(#fffdf6 80%,transparent);padding:1px 0 5px;z-index:2}
.paper h4{font-family:var(--serif);font-size:12.5px}
.paper .meta{font-size:8.5px;color:var(--muted);margin-top:2px}
.paper .cnt{position:absolute;right:10px;top:8px;font-size:8.5px;color:var(--green);background:#e6ecdf;border-radius:8px;padding:2px 7px}
.paper p{font-family:var(--serif);font-size:11px;line-height:1.8;text-indent:2em;color:#40342a;text-align:justify;margin-top:5px}
.paper .pphoto{width:100%;border-radius:8px;margin-top:8px;display:block;box-shadow:0 3px 10px #6b4f3422}
.paper .pcap{font-size:8.5px;color:var(--muted);text-align:center;margin-top:3px}
.paper .mark{background:#f3e2c8;border-radius:4px;padding:0 3px}
.paper .todo{background:#fbe9e2;border-radius:4px;padding:0 3px;color:#8d3f22}
.paper .foot{margin-top:8px;font-size:9px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.paper.flash{animation:paperFlash 1.2s ease}
@keyframes paperFlash{0%{box-shadow:0 0 0 0 #9a4b2b66}60%{box-shadow:0 0 0 12px #9a4b2b22}100%{box-shadow:0 8px 22px #6b4f3414}}
.paper .skeleton{color:var(--muted);font-size:11px;text-align:center;padding:18px 0 8px;line-height:2}
.paper .skeleton b{color:var(--tan)}
.source-legend{display:flex;gap:12px;margin:10px 0 8px;font-size:9px;color:var(--muted)}
.source-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.source-father{background:#f4dfc9;color:#763d24;border-radius:4px;padding:1px 3px}
.source-helper{background:#dce9ed;color:#285569;border-radius:4px;padding:1px 3px}
.micro-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:8px 0}
.micro-card small{font-size:9px;color:var(--muted)}
.micro-card p{font-size:13px;line-height:1.9;text-indent:0;margin-top:6px;text-align:left}
.micro-card.waiting{border-style:dashed;color:var(--muted);font-size:10px}
/* 立体书（成册阶段）：摊开的左右两页，完整正文，打开后不再动 */
.paper.bookmode{padding:6px}
.bookwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:6px 0}
.book3d{position:relative;width:600px;height:438px;perspective:2000px;transform-style:preserve-3d;transform:translateX(-150px);animation:bookIn .65s ease;transition:transform 2.1s ease-in-out}
@keyframes bookIn{from{opacity:0;transform:translate(-150px,26px) scale(.85)}to{opacity:1;transform:translateX(-150px)}}
.book3d.open{transform:translateX(0)}
.book3d:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#8a6f4d33 40%,#6b4f3450 50%,#8a6f4d33 60%,transparent);z-index:6;pointer-events:none;opacity:0;transition:opacity .5s ease .9s}
.book3d.open:before{opacity:1}
.book-leaf{position:absolute;left:300px;top:0;width:300px;height:100%;transform-style:preserve-3d;transform-origin:left center;z-index:8;transition:transform 2.1s ease-in-out}
.book3d.open .book-leaf{transform:rotateY(-180deg)}
.bcover,.bpage{position:absolute;top:0;bottom:0;backface-visibility:hidden}
.bcover{left:0;width:100%;border-radius:6px 14px 14px 6px;background:linear-gradient(150deg,#8d4326,#6f3120 60%,#5d2a1b);color:#f5e7cf;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;border-left:12px solid #4e2317;box-shadow:4px 6px 22px #6b4f3438}
.bcover .seal{width:40px;height:40px;border-radius:10px;background:#f5e7cf;color:#8d4326;display:grid;place-items:center;font-family:var(--serif);font-size:22px}
.bcover h3{font-family:var(--serif);font-size:22px;letter-spacing:6px;writing-mode:vertical-rl;margin:0}
.bcover small{font-size:9.5px;letter-spacing:2px;opacity:.85}
.bpage{background:linear-gradient(175deg,#fffdf6,#faf3e6);padding:16px 18px;font-family:var(--serif);font-size:9.8px;line-height:1.74;color:#40342a;overflow:hidden;box-shadow:2px 4px 16px #6b4f3428;opacity:0;transition:opacity .5s ease .8s}
.book3d.open .bpage{opacity:1}
.bpage.bleft{left:0;width:100%;border-radius:5px 0 0 5px;border-right:1px solid #e6d8bf;transform:rotateY(180deg);opacity:1}
.bpage.bright{left:300px;width:300px;border-radius:0 5px 5px 0;border-left:1px solid #e6d8bf}
.bpage img{width:100%;border-radius:5px;display:block}
.bpage h5{font-size:11.5px;margin-bottom:4px}
.bpage p{text-indent:2em;text-align:justify;margin-top:4px}
.bpage .cap{font-size:7.5px;color:var(--muted);text-align:center;font-family:var(--sans);margin-top:2px}
.bpage .foot2{margin-top:6px;font-size:8px;color:var(--muted);border-top:1px dashed var(--line);padding-top:4px;font-family:var(--sans)}
</style>
</head>
<body>
<div id="zoom">
<div class="topbar">
  <h1><i>忆</i>银发回忆录 · 双端协同</h1>
  <div class="nodes" id="nodes"></div>
  <button id="autoplay">▶ 自动演示全流程</button>
</div>
<div class="stepbar">
  <button class="nav" id="prev">‹</button>
  <span class="st-name" id="stName"></span>
  <span class="st-side" id="stSide"></span>
  <div class="dots" id="dots"></div>
  <button class="nav" id="next">›</button>
  <span class="agent" id="agentNote"></span>
</div>

<script>
/* 设计台 1560×1040，窗口放不下时整体等比缩放 */
function fitZoom(){const z=document.getElementById('zoom');const s=Math.min(1,innerWidth/1580,innerHeight/1060);z.style.transform=`translateX(-50%) scale(${s})`;}
addEventListener('resize',fitZoom);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)fitZoom();});
fitZoom();setTimeout(fitZoom,300);setTimeout(fitZoom,1200);

/* ===== iframe 去壳 + 双通道驱动 ===== */
const STRIP=`.stage{padding:0!important;background:var(--paper)!important;min-height:100%}
.stage-caption,.stage-note{display:none!important}
.phone{width:410px!important;height:866px!important;max-width:none!important;padding:0!important;border-radius:0!important;background:none!important;box-shadow:none!important}
.device-screen{border-radius:0!important}.dynamic-island{display:none!important}.status-bar{height:42px!important}`;
const BRIDGE=`window.addEventListener('message',function(e){if(typeof e.data==='string'&&e.data.indexOf('##cmd##')===0){try{eval(e.data.slice(7))}catch(_){}}});`;
function inject(f){try{const d=f.contentDocument;if(!d||d.getElementById('stripchrome'))return;
  const s=d.createElement('style');s.id='stripchrome';s.textContent=STRIP;d.head.appendChild(s);
  const b=d.createElement('script');b.textContent=BRIDGE;d.head.appendChild(b);}catch(e){}}
function cmd(f,js){if(!js)return true;
  try{f.contentWindow.eval(js);return true;}catch(e){}
  try{f.contentWindow.postMessage('##cmd##'+js,'*');return true;}catch(e){}
  return false;
}
/* 终极兜底：无法脚本控制 iframe 时（如 file:// 直开），改用 ?screen= URL 切页，App 原生支持 */
const BASE={L:'app.html?role=narrator',R:'app.html?role=helper'};
let SRC_MODE=null;
function detectMode(f){if(SRC_MODE!==null)return;try{void f.contentDocument.body;SRC_MODE=false;}catch(e){SRC_MODE=true;}}
function fallbackAction(js){
  if(!js)return null;
  const role=js.match(/memoDemo\.selectRole\('([^']+)'\)/);
  if(role)return {action:'select-role',role:role[1]};
  const repair=js.match(/memoDemo\.repair\((\d)\)/);
  if(repair)return {action:'repair',stage:Number(repair[1])};
  if(js.includes('memoDemo.saveRepair()'))return {action:'save-repair'};
  if(js.includes('memoDemo.syncRepair()'))return {action:'sync-repair'};
  const step=js.match(/memoDemo\.step\('([^']+)'\)/);
  if(step)return {action:'step',id:step[1]};
  if(js.includes('canvas-arrange'))return {action:'canvas-arrange'};
  if(js.includes('canvas-generate'))return {action:'canvas-generate'};
  return null;
}
function drive(f,side,js,scr){
  if(SRC_MODE===null)detectMode(f);
  if(SRC_MODE){
    const action=fallbackAction(js);
    const send=()=>{if(action)f.contentWindow.postMessage({memoDemo:action},'*');};
    if(scr&&f.dataset.scr!==scr){f.dataset.scr=scr;f.addEventListener('load',send,{once:true});f.src=BASE[side]+'&screen='+scr;}
    else send();
    return true;
  }
  return cmd(f,js);
}

/* 标注：连线末端动效圆点精确指向 App 真实元素（iframe 410×866 缩放 0.947 居中于 394×820 屏内），浮窗放在手机靠中间栏一侧 */
const SC=0.947,OFFX=(394-410*SC)/2+10,OFFY=(820-866*SC)/2+10;
const APPURL='app.html?';
let annoToken=0;
function placeAnnos(f,phoneEl,list,out,quiet){
  if(!list||!list.length)return 0;
  let targets=[];
  list.forEach(a=>{let el=null;try{el=f.contentDocument&&f.contentDocument.querySelector(a[0]);}catch(e){}targets.push(el);});
  /* 第一个不在视口内的目标，先滚到屏幕中间再量位置 */
  try{
    const off=targets.find(el=>{if(!el)return false;const r=el.getBoundingClientRect();return r.bottom<0||r.top>866;});
    if(off)off.scrollIntoView({block:'center'});
  }catch(e){}
  const svgNS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(svgNS,'svg');svg.setAttribute('class','conn');
  const right=out==='out-r';
  const slots=[0.2,0.45,0.7];let fb=0,miss=0;
  list.forEach((a,k)=>{
    let dx=null,dy=null;const el=targets[k];
    try{
      if(el){const r=el.getBoundingClientRect();
        if(r.width>0||r.height>0){dx=OFFX+(r.left+r.width/2)*SC;dy=OFFY+(r.top+r.height/2)*SC;}}
    }catch(e){}
    if(dx===null||isNaN(dx)){miss++;dx=right?370:44;dy=slots[fb++%3]*780;}
    dx=Math.max(16,Math.min(398,dx));dy=Math.max(12,Math.min(808,dy));
    const top=Math.max(6,Math.min(744,dy-16));
    const card=document.createElement('div');
    card.className='anno '+out;card.style.top=top+'px';
    if(!quiet)card.style.animationDelay=(k*0.12)+'s';else card.style.animation='none';
    card.innerHTML=`<b>${a[1]}</b>${a[2]}`;
    phoneEl.appendChild(card);
    const dot=document.createElement('div');
    dot.className='hitdot';dot.style.left=dx+'px';dot.style.top=dy+'px';if(quiet)dot.style.animation='none';
    phoneEl.appendChild(dot);
    const line=document.createElementNS(svgNS,'line');
    line.setAttribute('x1',right?426:-12);line.setAttribute('y1',top+16);
    line.setAttribute('x2',dx);line.setAttribute('y2',dy);
    svg.appendChild(line);
  });
  phoneEl.appendChild(svg);
  return miss;
}

 <p>这张照片是<span class="todo">零一年</span>的广交会，我们第一次去参加。展位是最小的那种，三米乘三米，在角落里。我带了两个样品箱，是自己扛进去的。</p>
 <p>那天来了一位马来西亚的客户，华裔，姓黄。他问了几个技术参数，留了一张名片。我当时英文不行，拿个计算器跟他比划价格。后来黄先生给了我们第一张出口订单——<span class="mark">三万美金</span>。我高兴得一晚上没睡。</p>

 final:`<div class="phead"><span class="cnt">正文 553 字 · 已确认</span><h4>第二章 · 第一个出口订单</h4><div class="meta">口述：陈建华 ｜ 整理：小忆（经本人确认）</div></div>
 <img class="pphoto" src="${AVI["expo.png"]}"><div class="pcap">2001 年 · 广交会 · 本章配图已入册</div>
 <p>这张照片是二〇〇一年的广交会，我们第一次去参加。展位是最小的那种，三米乘三米，在角落里。我带了两个样品箱，是自己扛进去的。</p>
 <p>那天来了一位马来西亚的客户，华裔，姓黄。他看了看我们的产品，问了几个技术参数，留了一张名片。我当时英文不行，就拿个计算器跟他比划价格。后来，这位黄先生给了我们第一张出口订单——三万美金。我高兴得一晚上没睡着。三万美金，在那时候对我是一笔很大的钱。</p>
 <p>合同签完，我没敢告诉国平，怕他以为我在吹牛。等货真的装上了船，我才跟他说。他愣了一下，然后笑了，说：「行啊，老陈。」</p>
 <p>交货那天我自己去的码头，就站在那里，看着集装箱一个一个装上去，心里说不出是什么感觉。后来想想，大概就是从那一天起，我觉得我们厂的东西，是真的可以卖到很远的地方去的。</p>
 <p>回来的火车上，我把那份合同叠成四折，放在贴身的口袋里，一路摸出来看了三次，纸边都让我捏软了。车到杭州站时天刚亮，我在站台上站了一会儿，觉得这座城市好像跟昨天出门时不太一样了。</p>
 <p>黄先生后来跟了我们十几年。每年他来中国，我都请他吃饭。他不会用筷子，每次都让我教，但每次都学不会。这件事我们笑了很多年。如今厂子早就不在了，可那张照片还在——展位小，人站得直。那是我这一辈子，第一次把生意做到了门外去。</p>
 <div class="foot">「零一年」依本人原话写作「二〇〇一年」；正文每一个字都经本人回听确认。</div>`,

/* 成册动画：合成提示语粒子消散（含装饰线一起消失）→ 立体书升起 → 封面缓缓打开成左右两页，之后保持不动 */
let bookOpened=false,bookShown=false;
function playBookAnim(){
  const m=document.getElementById('mergeTxt');
  m.innerHTML=MERGE_TXT.split('').map((c,i)=>`<span style="--dl:${(i*0.03).toFixed(2)}s;--tx:${(Math.random()*180-90).toFixed(0)}px;--ty:${(-30-Math.random()*90).toFixed(0)}px;--rt:${(Math.random()*160-80).toFixed(0)}deg">${c===' '?'&nbsp;':c}</span>`).join('');
  m.classList.add('dissolve');
  setTimeout(()=>{m.classList.add('gone');},1250);
  setTimeout(()=>{const b=document.getElementById('book3d');if(b)b.classList.add('open');},650);
}
function resetMerge(){
  const m=document.getElementById('mergeTxt');
  m.classList.remove('dissolve','gone');m.textContent=MERGE_TXT;
}
function hideMerge(){const m=document.getElementById('mergeTxt');m.classList.add('gone');}

/* ===== 节点 × 步骤（focus：L=只切讲述端 R=只切协助端 both=两端同切；浮窗文案描述产品核心功能与 AI 判断设计） ===== */
function onboardingDemoStep(name,side,action,activeText,agent,selector){
  const father=side==='L',wait=father?'女儿仍可看到「我来协助」入口':'父亲已完成自己的选择';
  const active={n:activeText,ag:agent},idle={n:wait,ag:'各自选择与确认身份'};
  const activeXY={c:activeText,f:'入驻流程逐步显示当前选择',ag:agent};
  const idleXY={c:'等待另一端',f:'保留已有选择',ag:'不代替对方作答'};
  return {name,focus:side,[side]:action,
    ...(selector?{[father?'annosL':'annosR']:[[selector,name,agent]]}:{}),
    ioL:father?active:idle,ioR:father?idle:active,
    xyL:father?activeXY:idleXY,xyR:father?idleXY:activeXY,
    agent:'小忆判断：'+agent,
    jtbdL:father?activeText:'陈建华保留讲述者身份，等待女儿完成自己的入驻。',
    jtbdR:father?'陈思颖稍后以协助者身份加入。':activeText};
}

/* ===== 驱动 ===== */
const $=s=>document.querySelector(s);
$('#nodes').innerHTML=NODES.map((n,i)=>`<button class="nodebtn ${n.free?'free':''}" data-i="${i}"><b>${n.id}</b>${n.name}</button>`).join('');
let ni=0,si=0,driveToken=0;
function scheduleDrive(f,side,js,scr,tok,attempt=0){
  if(!js&&!scr)return;
  setTimeout(()=>{
    if(tok!==driveToken)return;
    if(SRC_MODE===null)detectMode(f);
    if(!SRC_MODE){
      try{if(f.contentDocument.readyState!=='complete'&&attempt<15)return scheduleDrive(f,side,js,scr,tok,attempt+1);}catch(e){}
    }
    drive(f,side,js,scr);
  },attempt?150:350);
}
function ioHtml(side,d){
  const hd=side==='L'?`<img src="${AVI["narrator.png"]}">父亲 · 原声输入`:`<img src="${AVI["role-helper.png"]}">女儿 · 线索输入`;
  return `<h4>${hd}</h4>${d.q?`<div class="quote">${d.q}</div>`:''}<div class="note">${d.n}</div><div class="ag"><b>agent</b> · ${d.ag}</div>`;
}
function xyHtml(side,d){
  const hd=side==='L'?'→ 讲述端小忆':'→ 协助端小忆';
  return `<h5><i>忆</i>${hd}</h5><b>指令</b>：${d.c}<br><b>体现</b>：${d.f}<div class="ag"><b>判断</b> · ${d.ag}</div>`;
}
function applyStep(){
  const n=NODES[ni],s=n.steps[si];
  document.querySelectorAll('.nodebtn').forEach((b,k)=>b.classList.toggle('on',k===ni));
  const fL=$('#fL'),fR=$('#fR');
  const doL=s.focus!=='R',doR=s.focus!=='L';
  /* 选身份/进入身份：整页换 src（任何模式都能切） */
  if(s.srcL&&fL.dataset.cur!==s.srcL){fL.dataset.cur=s.srcL;fL.dataset.scr='';fL.src=APPURL+s.srcL;}
  if(s.srcR&&fR.dataset.cur!==s.srcR){fR.dataset.cur=s.srcR;fR.dataset.scr='';fR.src=APPURL+s.srcR;}
  const scr=SCR[ni+'-'+si]||{};
  const jsL=doL?s.L:s.alsoL, jsR=doR?s.R:s.alsoR;
  // 每个按钮动作只执行一次；切换身份后等待 iframe 页面加载完成。
  const dt=++driveToken;
  scheduleDrive(fL,'L',jsL,scr.L,dt);
  scheduleDrive(fR,'R',jsR,scr.R,dt);
  // 浮窗：先立即清掉旧的，渲染稳定后只放一次（令牌防止上一步的迟放造成二次闪现）
  ['#phL','#phR'].forEach(p=>{$(p).querySelectorAll('.anno,.hitdot,.conn').forEach(e=>e.remove());});
  const tok=++annoToken;
  setTimeout(()=>{if(tok!==annoToken)return;
    const mL=placeAnnos(fL,$('#phL'),doL?s.annosL:null,'out-r');
    const mR=placeAnnos(fR,$('#phR'),doR?s.annosR:null,'out-l');
    /* 分阶段页面（如修复中/生成中）目标元素稍晚才出现：有缺失则 2.4s 后无动画补放一次 */
    if(mL+mR>0)setTimeout(()=>{if(tok!==annoToken)return;
      ['#phL','#phR'].forEach(p=>{$(p).querySelectorAll('.anno,.hitdot,.conn').forEach(e=>e.remove());});
      placeAnnos(fL,$('#phL'),doL?s.annosL:null,'out-r',true);
      placeAnnos(fR,$('#phR'),doR?s.annosR:null,'out-l',true);
    },2400);
  },1050);
  // 非操作端压暗，视线聚焦本步操作端
  $('#phL').classList.toggle('dim',s.focus==='R');
  $('#phR').classList.toggle('dim',s.focus==='L');
  $('#jtbdL').innerHTML='<b>讲述端</b> · '+s.jtbdL;
  $('#jtbdR').innerHTML='<b>协助端</b> · '+s.jtbdR;
  $('#stName').textContent=`节点 ${n.id} · ${n.name} ｜ ${s.name}`;
  $('#stSide').textContent=s.focus==='L'?'本步：讲述端':s.focus==='R'?'本步：协助端':'本步：两端';
  $('#dots').innerHTML=n.steps.map((_,k)=>`<i class="${k===si?'on':''}"></i>`).join('');
  $('#agentNote').innerHTML=s.agent?`<b>agent</b> · ${s.agent}`:'';
  $('#ioL').innerHTML=ioHtml('L',s.ioL);$('#ioR').innerHTML=ioHtml('R',s.ioR);
  $('#xyL').innerHTML=xyHtml('L',s.xyL);$('#xyR').innerHTML=xyHtml('R',s.xyR);
  /* 文稿 / 成册 */
  const pk=s.paper||n.paper;
  const p=$('#paper');
  if(pk==='book'){
    if(!bookShown){
      /* 首次进入成册阶段才渲染书；之后的书静态保留，不再重建 */
      p.classList.add('bookmode');p.innerHTML=PAPERS.book;
      if(s.anim==='book'&&!bookOpened){bookOpened=true;playBookAnim();}
      else{hideMerge();const b=document.getElementById('book3d');if(b)b.classList.add('open');}
      bookShown=true;
    }else{hideMerge();}
  }else{
    bookShown=false;bookOpened=false;
    p.classList.remove('bookmode');p.innerHTML=PAPERS[pk];resetMerge();
    if(n.flash){p.classList.remove('flash');void p.offsetWidth;p.classList.add('flash');}
  }
}
function go(ni2,si2){ni=Math.max(0,Math.min(NODES.length-1,ni2));si=Math.max(0,Math.min(NODES[ni].steps.length-1,si2));applyStep();}
$('#nodes').addEventListener('click',e=>{const b=e.target.closest('.nodebtn');if(b){stopAuto();go(Number(b.dataset.i),0);}});
$('#prev').addEventListener('click',()=>{stopAuto();si>0?go(ni,si-1):go(ni-1,NODES[Math.max(0,ni-1)].steps.length-1);});
$('#next').addEventListener('click',()=>{stopAuto();si<NODES[ni].steps.length-1?go(ni,si+1):go(ni+1,0);});
let auto=null;
function stopAuto(){if(auto){clearInterval(auto);auto=null;$('#autoplay').textContent='▶ 自动演示全流程';$('#autoplay').classList.remove('playing');}}
$('#autoplay').addEventListener('click',()=>{
  if(auto)return stopAuto();
  $('#autoplay').textContent='■ 停止';$('#autoplay').classList.add('playing');
  go(0,0);
  auto=setInterval(()=>{if(si<NODES[ni].steps.length-1){si++;}else if(ni<NODES.length-1){ni++;si=0;}else{stopAuto();return;}applyStep();},3000);
});
let loaded=0,booted=false;
function boot(){inject($('#fL'));inject($('#fR'));if(booted)return;if(++loaded>=2){booted=true;setTimeout(()=>applyStep(),500);}}
$('#fL').addEventListener('load',boot);$('#fR').addEventListener('load',boot);
$('#fL').dataset.cur='fresh=1';$('#fR').dataset.cur='fresh=1';
</script>
